<!DOCTYPE html>
<html>
<head>
    <title>CSS Practice Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f0fff4;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: darkgreen;
        }

        .section {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 15px 0;
            background-color: white;
        }

        /* Colors */
        .color-text {
            color: red;
        }

        .bg-color {
            background-color: yellow;
        }

        /* Fonts */
        .font-style {
            font-family: "Courier New";
            font-size: 20px;
            font-weight: bold;
        }

        /* Border */
        .border-box {
            border: 2px solid green;
            padding: 10px;
        }

        /* Box Model */
        .box-model {
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
        }

        /* Display */
        .inline {
            display: inline;
            background-color: lightblue;
        }

        .block {
            display: block;
            background-color: lightcoral;
        }

        /* Button */
        .btn {
            background-color: #2ecc71;
            padding: 10px;
            border: none;
        }

        .btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>

<body>

<h1>CSS Practice Page</h1>

<div class="section">
    <h2>Colors</h2>
    <p class="color-text">This is colored text</p>
    <p class="bg-color">This has background color</p>
</div>

<div class="section">
    <h2>Fonts</h2>
    <p class="font-style">Styled Font Example</p>
</div>

<div class="section">
    <h2>Borders</h2>
    <div class="border-box">This box has a border</div>
</div>

<div class="section">
    <h2>Box Model</h2>
    <div class="box-model">Padding + Margin Example</div>
</div>

<div class="section">
    <h2>Display</h2>
    <span class="inline">Inline 1</span>
    <span class="inline">Inline 2</span>

    <div class="block">Block 1</div>
    <div class="block">Block 2</div>
</div>

<div class="section">
    <h2>Button</h2>
    <button class="btn">Hover Me</button>
</div>

</body>
</html>
