<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess Game</title>

<link rel="stylesheet" href="style.css">
</head>

<body onload="init()">

<div class="container">
    <h2>🎯 Guess the Number</h2>

    <p id="range"></p>
    <p id="prize"></p>

    <input type="number" id="guess" placeholder="Enter guess & press Enter">

    <br><br>

    <!-- ✅ Reset Button -->
    <button onclick="resetGame()">🔄 Reset Game</button>

    <p id="msg"></p>
</div>

<script src="app.js"></script>

</body>
</html>
